name: Actualizar cuotas antes de cada jornada

# Cada 15 min en horario de partidos NFL (UTC). El script solo descarga
# ~1 h antes de cada bloque de kickoffs del día; el resto de ejecuciones
# terminan sin gastar créditos de The-Odds-API.
on:
  schedule:
    - cron: "7,22,37,52 11-23 * * *"
    - cron: "7,22,37,52 0-2 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Descargar ahora aunque no toque jornada"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: odds-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Revisar jornadas y descargar cuotas
        id: refresh
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          PYTHONUTF8: "1"
        run: python refresh_snapshot.py ${{ inputs.force && '--force' || '' }}

      - name: Guardar snapshot en el repo
        if: steps.refresh.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add snapshots/
          if [ -d tracking ]; then git add tracking/; fi
          if git diff --cached --quiet; then
            echo "Sin cambios en snapshots/ ni tracking/"
            exit 0
          fi
          git commit -m "Cuotas: jornada ${{ steps.refresh.outputs.slot }}"
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep 5
          done
          exit 1
